name: lldj
description: 鹿鹿短剧 —— 由 lldj2.4.0V5.apk 移植的 iOS 版本
publish_to: "none"
version: 2.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # ---- 与原 APK 一致的核心依赖 ----
  get: ^4.6.6                 # 状态管理 / 路由（原 app 使用）
  dio: ^5.4.3+1               # 网络
  provider: ^6.1.2
  rxdart: ^0.27.0
  event_bus: ^2.0.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  cached_network_image: ^3.3.1
  flutter_cache_manager: ^3.3.2
  flutter_svg: ^2.0.10+1
  flutter_screenutil: ^5.0.1
  pull_to_refresh: ^2.1.0
  carousel_slider: ^4.2.1
  extended_nested_scroll_view: ^0.4.0
  linked_scroll_controller: ^0.3.0
  waterfall_flow: ^0.12.4
  qr_flutter: ^4.1.0
  qr_code_scanner: ^4.3.0
  url_launcher: ^6.2.5
  video_player: ^2.8.7
  video_thumbnail: ^0.5.3
  image_picker: ^1.1.2
  image_gallery_saver_plus: ^1.0.5
  permission_handler: ^11.3.0
  device_info_plus: ^10.1.0
  connectivity_plus: ^6.0.5
  package_info_plus: ^8.0.2
  oktoast: ^3.3.0
  loading_animation_widget: ^2.0.3
  like_button: ^3.1.0
  intl: ^0.19.0
  uuid: ^4.4.0
  logging: ^1.2.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.5
  web_socket_channel: ^3.0.1
  flutter_inappwebview: ^6.1.0
  volume_controller: ^1.1.0
  screen_brightness: ^1.0.1
  battery_plus: ^6.0.0
  sensors_plus: ^6.0.0
  visibility_detector: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/acg/
    - assets/images/ai/
    - assets/images/app_icon/
    - assets/images/comment/
    - assets/images/common/
    - assets/images/community/
    - assets/images/community/post_detail/
    - assets/images/holiday/
    - assets/images/holiday/1/
    - assets/images/holiday/5/
    - assets/images/home/
    - assets/images/launch/
    - assets/images/live_images/
    - assets/images/mine/
    - assets/images/mine/message/
    - assets/images/video/
    - assets/fonts/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf