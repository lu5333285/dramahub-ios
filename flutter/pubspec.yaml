name: lldj
description: 鹿鹿短剧 —— 由 lldj2.4.0V5.apk 移植的 iOS 版本
publish_to: "none"
version: 2.4.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

# 仅保留 lib/ 实际 import 的依赖（全部经 pub.dev 校验存在且与 Flutter 3.24/Dart 3.5 兼容）
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  get: ^4.6.6                       # 状态管理 / 路由（原 app 同款）
  dio: ^5.4.3                       # 网络
  flutter_screenutil: ^5.9.0        # 屏幕适配
  cached_network_image: ^3.3.1      # 图片缓存
  video_player: ^2.8.7              # m3u8 播放
  pointycastle: ^3.9.1              # AES-128-CBC 分片解密（本地 HLS 代理用）

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/acg/
    - assets/images/ai/
    - assets/images/app_icon/
    - assets/images/comment/
    - assets/images/common/
    - assets/images/community/
    - assets/images/community/post_detail/
    - assets/images/holiday/
    - assets/images/holiday/1/
    - assets/images/holiday/5/
    - assets/images/home/
    - assets/images/launch/
    - assets/images/live_images/
    - assets/images/mine/
    - assets/images/mine/message/
    - assets/images/video/
    - assets/fonts/
  fonts:
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
